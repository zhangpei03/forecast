# Forecast Lab 内网部署 nginx 配置
# 职责: SSO 鉴权前置 (auth_request) + 反代 Streamlit + WebSocket 透传
#
# 变量 ${SSO_APP_ID} / ${SERVER_NAME} 由容器启动脚本用 envsubst 渲染,
# 或直接在镜像构建期写死。

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 60M;          # 配合 Streamlit maxUploadSize=50M + 余量
    proxy_read_timeout 600s;           # 训练同步等待 + 余量 (>5min)
    proxy_send_timeout 600s;

    # ── SSO 三接口直通 sidecar (无需鉴权) ──
    location /sso/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── nginx 内部子请求: 校验登录态 ──
    location = /_sso_check {
        internal;
        proxy_pass http://127.0.0.1:9000/sso/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    # ── 业务请求: 先鉴权, 再反代 Streamlit ──
    location / {
        auth_request /_sso_check;
        auth_request_set $sso_user $upstream_http_x_sso_user;

        # 未登录 (401) -> 跳 SSO 登录页
        error_page 401 = @sso_login;

        proxy_pass http://127.0.0.1:8501;
        proxy_set_header X-SSO-User $sso_user;          # 透传用户身份给 Streamlit
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Streamlit 依赖 WebSocket, 必须透传 Upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location @sso_login {
        # SSO 登录基址 / 回跳协议 / appid 在启动期由 entrypoint 注入。
        # 生产默认: SSO_LOGIN_BASE=http://mis.diditaxi.com.cn/auth/sso/login, CALLBACK_SCHEME=https
        # 本地集成: 指向 mock-sso, CALLBACK_SCHEME=http
        return 302 "${SSO_LOGIN_BASE}?appid=${SSO_APP_ID}&jumpto=${CALLBACK_SCHEME}://$http_host/sso/callback";
    }
}
