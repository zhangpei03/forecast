; Forecast Lab 单容器进程编排: nginx + sso-sidecar + streamlit
[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sso-sidecar]
command=uvicorn deploy.sso_sidecar.main:app --host 127.0.0.1 --port 9000
directory=/app
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# 后端进程示例(以 Streamlit 为例)。换框架时改 command:
#   FastAPI:  uvicorn app.main:app --host 127.0.0.1 --port 8501
#   Flask:    gunicorn -b 127.0.0.1:8501 app:app
# 后端只监听 127.0.0.1, 由 nginx 对外; nginx 反代端口需与此一致(8501)。
[program:streamlit]
command=streamlit run app.py
    --server.address 127.0.0.1
    --server.port 8501
    --server.headless true
    --server.enableXsrfProtection false
    --server.enableCORS false
directory=/app
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
