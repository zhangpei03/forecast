[server]
maxUploadSize = 50
headless = true

[browser]
gatherUsageStats = false

[client]
# 隐藏开发者工具栏与相关快捷键(如按 C 弹出 Clear caches 对话框),
# 部署给终端用户时用 minimal, 避免误触清缓存/重跑等开发者动作。
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#101828"
linkColor = "#4F46E5"
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
borderColor = "#E4E7EC"
dataframeBorderColor = "#E4E7EC"
dataframeHeaderBackgroundColor = "#F9FAFB"
showWidgetBorder = true
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 14
chartCategoricalColors = ["#4F46E5", "#2E90FA", "#12B76A", "#F79009", "#F04438", "#98A2B3"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F9FAFB"
textColor = "#344054"
borderColor = "#E4E7EC"
