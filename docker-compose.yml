# Local deployment smoke test.  The company SSO package remains present, but
# SSO is disabled and didi_sso injects a fixed development user.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: forecast_lab
      MYSQL_USER: forecast
      MYSQL_PASSWORD: forecastpw
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpw"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      DATABASE_URL: "mysql+pymysql://forecast:forecastpw@mysql:3306/forecast_lab?charset=utf8mb4"
      MAX_CONCURRENT_TRAINING: "3"
      FORECAST_LAB_RUNTIME_DIR: "/data"
      APP_ENV: "dev"
      SSO_ENABLED: "false"
      SSO_DEFAULT_LDAP: "local-dev"
      SSO_DEFAULT_USER_NAME: "Local developer"
    volumes:
      - app_data:/data

volumes:
  mysql_data:
  app_data:
