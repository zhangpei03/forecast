[project]
name = "finance-forecast-lab"
version = "0.1.0"
description = "Enterprise finance forecasting evaluation lab powered by Streamlit and AutoGluon TimeSeries."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "streamlit>=1.58,<1.59",
  "autogluon.timeseries>=1.5,<1.6",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "pyarrow>=18,<22",
  "openpyxl>=3.1,<4",
  "plotly>=6.0,<7",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "prophet>=1.1,<2",
  "statsforecast>=2,<3",
  "xgboost>=2,<4",
  "sqlalchemy>=2,<3",
  "pymysql>=1.1,<2",
  "cryptography>=43",
  "psutil>=5.9,<8",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "torch>=2,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
]

# torch 钉到 CPU wheel: 避开 autogluon 默认拉的 GPU 版 torch + 37 个 nvidia-*-cu12 包
# (无 GPU 的 OE 部署用不上 CUDA, 镜像可从 ~6GB 降到 ~2GB)。
# mac/arm 本来就是 CPU wheel, 此源主要影响 linux 容器构建。
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
